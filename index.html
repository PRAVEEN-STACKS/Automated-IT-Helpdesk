<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IEEE Triumph</title>
    <!-- Bootstrap 5.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4">
                
                <!-- Sign In Card -->
                <div class="card shadow border-0 p-4">
                    <div class="card-body">
                        
                        <!-- Logo Placeholder replacing "Sign In" text -->
                        <div class="text-center mb-4">
                            <img src="ieee_sairam-DekBYCPB.png" alt="IEEE Sairam Logo" class="img-fluid" style="max-height: 80px;">
                        </div>

                        <!-- Role Selector Tabs (Student / Faculty) -->
                        <ul class="nav nav-pills nav-justified mb-4" id="roleTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active fw-semibold" id="student-tab" data-bs-toggle="pill" data-bs-target="#student-pane" type="button" role="tab">Student</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link fw-semibold" id="faculty-tab" data-bs-toggle="pill" data-bs-target="#faculty-pane" type="button" role="tab">Faculty</button>
                            </li>
                        </ul>
                        
                        <!-- Dynamic Forms Wrapper -->
                        <div class="tab-content" id="roleTabContent">
                            
                            <!-- ==================== STUDENT SIGN IN ==================== -->
                            <div class="tab-pane fade show active" id="student-pane" role="tabpanel" aria-labelledby="student-tab">
                                <form>
                                    <div class="mb-3">
                                        <label for="studentId" class="form-label fw-semibold">Email</label>
                                        <input type="text" class="form-control" id="studentId" placeholder="Enter your email" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="studentPassword" class="form-label fw-semibold">Password</label>
                                        <div class="input-group">
                                            <input type="password" class="form-control password-input" id="studentPassword" placeholder="Enter password" required>
                                            <button class="btn btn-outline-secondary toggle-password" type="button">
                                                <i class="bi bi-eye"></i>
                                            </button>
                                        </div>
                                    </div>
                                    
                                    <div class="d-flex justify-content-between align-items-center mb-4">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input" id="rememberStudent">
                                            <label class="form-check-label text-muted small" for="rememberStudent">Remember me</label>
                                        </div>
                                        <a href="#" class="text-decoration-none small">Forgot your password?</a>
                                    </div>
                                    
                                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Sign In as Student</button>
                                </form>
                            </div>

                            <!-- ==================== FACULTY SIGN IN ==================== -->
                            <div class="tab-pane fade" id="faculty-pane" role="tabpanel" aria-labelledby="faculty-tab">
                                <form>
                                    <div class="mb-3">
                                        <label for="facultyId" class="form-label fw-semibold">Email</label>
                                        <input type="text" class="form-control" id="facultyId" placeholder="Enter your email" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="facultyPassword" class="form-label fw-semibold">Password</label>
                                        <div class="input-group">
                                            <input type="password" class="form-control password-input" id="facultyPassword" placeholder="Enter password" required>
                                            <button class="btn btn-outline-secondary toggle-password" type="button">
                                                <i class="bi bi-eye"></i>
                                            </button>
                                        </div>
                                    </div>
                                    
                                    <div class="d-flex justify-content-between align-items-center mb-4">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input" id="rememberFaculty">
                                            <label class="form-check-label text-muted small" for="rememberFaculty">Remember me</label>
                                        </div>
                                        <a href="#" class="text-decoration-none small">Forgot your password?</a>
                                    </div>
                                    
                                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Sign In as Faculty</button>
                                </form>
                            </div>

                        </div> <!-- End Tab Content -->
                    </div>
                </div>
                <!-- End Card -->
            </div>
        </div>
    </div>


    <!-- Bootstrap 5.3 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- JavaScript for Password Hide/Show Action -->
    <script>
       document.querySelectorAll('.toggle-password').forEach(button => {
    button.addEventListener('click', function () {
        // Traverses up to the input-group to find the password input element field box
        const passwordInput = this.closest('.input-group').querySelector('.password-input');
        const icon = this.querySelector('i');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    });
});
    </script>
</body>
</html>
